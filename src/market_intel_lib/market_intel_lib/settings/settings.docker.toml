# Docker/compose variant of the shared-library settings.
# Baked over settings.toml during the image build (see src/Dockerfile). Hosts point
# at compose service DNS names instead of 127.0.0.1.
[infisical.connection]
url_schema = "http"
host = "infisical-backend"
port = 8080

[infisical.auth]
# The Universal Auth CLIENT ID -- not the machine identity's own ID.
# Infisical shows these separately; identity `docker-news-bot` is
# 78b62812-c6eb-45be-87d7-182d2ad9b0ef, but Universal Auth logs in with this:
client_id = "e1e2f33c-cb15-4316-8a41-88c0ae998903"

[infisical.project]
# Project `trading-news-bot`.
project_id = "c3847f48-85fa-42f3-8e19-82b99a6c7939"
env_slug = "dev"
secret_path = "/"

[database]
url_schema = "postgresql+asyncpg"
host = "user-db"
port = 5432
database = "telegram_user_app_db"
username = "admin"

[s3]
endpoint = "http://s3-seaweedfs:8333"
