# Docker/compose variant of the shared-library settings.
# Baked over settings.toml during the image build (see src/Dockerfile). Hosts point
# at compose service DNS names instead of 127.0.0.1.
[infisical.connection]
url_schema = "http"
host = "infisical-backend"
port = 8080

[infisical.auth]
client_id = "0f36d94f-e990-4a9a-8b3a-cbb5fb62eea5"

[infisical.project]
project_id = "78b62812-c6eb-45be-87d7-182d2ad9b0ef"
env_slug = "dev"
secret_path = "/"

[database]
url_schema = "postgresql+asyncpg"
host = "user-db"
port = 5432
database = "telegram_user_app_db"
username = "admin"

[s3]
endpoint = "http://s3-seaweedfs:8333"
