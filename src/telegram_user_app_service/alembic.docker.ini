[alembic]
script_location = %(here)s/migrations

prepend_sys_path = .

path_separator = os
# Docker/compose variant: host points at the `user-db` compose service.
# Credentials match src/telegram_user_app_service/.db.env.
sqlalchemy.url = postgresql+psycopg2://admin:admin@user-db:5432/telegram_user_app_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
